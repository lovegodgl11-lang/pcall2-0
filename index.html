        // --- BUILT-IN & PERMANENT APPS ---
        const settingsApp = { id: 'app-settings', name: 'Desktop Settings', type: 'builtin', icon: 'https://img.icons8.com/fluency/96/settings.png', url: 'pcset.html' };
        const builtInApps = [
            { id: 'app-music', name: 'Music Player', type: 'builtin', icon: 'https://img.icons8.com/fluency/96/music.png' },
            { id: 'app-video', name: 'Video Player', type: 'builtin', icon: 'https://img.icons8.com/fluency/96/play-button-circled.png' }
        ];

        let actionState = {
            active: false, type: null, target: null, startX: 0, startY: 0,
            initialLeft: 0, initialTop: 0, initialWidth: 0, initialHeight: 0, draggedItemId: null
        };

        // --- Reusable Utility Functions ---
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
        }
        
        function showToast(message) {
            const existingToast = document.querySelector('.toast-notification');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.className = 'toast-notification fixed bottom-12 right-5 bg-gray-900 text-white py-2 px-4 rounded-lg shadow-lg z-50';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // --- Global Event Handlers for Drag/Resize ---
        function handleActionMove(e) {
            if (!actionState.active) return;
            e.preventDefault();

            if (actionState.type === 'drag') {
                const dx = e.clientX - actionState.startX;
                const dy = e.clientY - actionState.startY;
                actionState.target.style.left = `${actionState.initialLeft + dx}px`;
                actionState.target.style.top = `${actionState.initialTop + dy}px`;
            } else if (actionState.type === 'resize') {
                const dw = e.clientX - actionState.startX;
                const dh = e.clientY - actionState.startY;
                const newWidth = actionState.initialWidth + dw;
                const newHeight = actionState.initialHeight + dh;
                const minWidth = parseInt(getComputedStyle(actionState.target).minWidth, 10);
                const minHeight = parseInt(getComputedStyle(actionState.target).minHeight, 10);
                
                if (newWidth >= minWidth) actionState.target.style.width = `${newWidth}px`;
                if (newHeight >= minHeight) actionState.target.style.height = `${newHeight}px`;
            }
        }

        function handleActionEnd(e) {
            if (!actionState.active) return;
            const overlay = document.getElementById('global-action-overlay');
            if (overlay) {
                overlay.remove();
            }
            actionState.active = false;
            actionState.target = null;
        }

        // --- App & Window Management ---
        function getFaviconUrl(url) {
            try {
                const domain = new URL(url).hostname;
                return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
            } catch (e) {
                return 'https://img.icons8.com/color/96/000000/file.png'; // Default icon
            }
        }
        
        function launchApp(appData, action = 'popup') {
            if (!appData) return;
            if (appData.type === 'folder') {
                createWindow(appData);
                return;
            }
            if (appData.type === 'builtin' && action !== 'popup') {
                alert("Built-in apps can only be opened as popups.");
                return;
            }
            switch (action) {
                case 'popup':
                    createWindow(appData);
                    break;
                case 'newWindow':
                    window.open(appData.url, '_blank');
                    break;
                case 'sameWindow':
                    window.location.href = appData.url;
                    break;
            }
            hideContextMenu();
            startMenu.classList.add('hidden');
        }

        function createWindow(appData) {
            if (openWindows.has(appData.id)) {
                focusWindow(appData.id);
                return;
            }

            const template = document.getElementById('window-template');
            const clone = template.content.cloneNode(true);
            const win = clone.querySelector('.window');
            win.id = `window-${appData.id}`;
            win.querySelector('.title').textContent = appData.name;
            const windowBody = win.querySelector('.window-body');

            if (appData.id === 'app-music') {
                windowBody.innerHTML = createMusicPlayerContent();
                setupMusicPlayer(win);
            } else if (appData.id === 'app-video') {
                windowBody.innerHTML = createVideoPlayerContent();
                setupVideoPlayer(win);
            } else if (appData.type === 'folder') {
                windowBody.classList.add('folder-body');
                rerenderFolderWindow(appData.id, win);
            } else if (appData.url) {
                const iframe = document.createElement('iframe');
                iframe.src = appData.url;
                iframe.frameborder = "0";
                windowBody.appendChild(iframe);
            }

            const initialWidth = 800;
            const initialHeight = 600;
            win.style.width = `${initialWidth}px`;
            win.style.height = `${initialHeight}px`;

            const viewportHeight = window.innerHeight - 40;
            const viewportWidth = window.innerWidth;
            const top = 50 + (openWindows.size * 25) % Math.max(1, viewportHeight - initialHeight);
            const left = 100 + (openWindows.size * 25) % Math.max(1, viewportWidth - initialWidth);
            win.style.top = `${top}px`;
            win.style.left = `${left}px`;
            
            mainContent.appendChild(win);
            
            const windowData = { element: win, minimized: false, savedState: {} };
            openWindows.set(appData.id, windowData);
            
            setupWindowInteractions(appData.id, win);
            addToTaskbar(appData.id, appData.name);
            focusWindow(appData.id);
        }

        function focusWindow(id) {
            if (activeWindowId && activeWindowId !== id) {
                const oldActive = openWindows.get(activeWindowId);
                if(oldActive) {
                    oldActive.element.style.zIndex = zIndexCounter - 1;
                    document.getElementById(`taskbar-${activeWindowId}`)?.classList.remove('active');
                }
            }
            const windowData = openWindows.get(id);
            if(windowData) {
                windowData.element.style.zIndex = zIndexCounter++;
                document.getElementById(`taskbar-${id}`)?.classList.add('active');
                activeWindowId = id;

                const wasMinimized = windowData.minimized;
                if(wasMinimized) {
                    windowData.element.style.display = 'flex';
                    windowData.minimized = false;
                }
            }
        }

        function closeWindow(id) {
            const windowData = openWindows.get(id);
            if (windowData) {
                windowData.element.remove();
                openWindows.delete(id);
                document.getElementById(`taskbar-${id}`)?.remove();
            }
        }
        
        function minimizeWindow(id) {
            const windowData = openWindows.get(id);
            if(windowData) {
                windowData.element.style.display = 'none';
                windowData.minimized = true;
                document.getElementById(`taskbar-${id}`)?.classList.remove('active');
                if (activeWindowId === id) {
                    activeWindowId = null;
                }
            }
        }
        
        function toggleMaximizeWindow(id) {
            const windowData = openWindows.get(id);
            if(windowData) {
                const win = windowData.element;
                if(win.classList.contains('maximized')) {
                    win.classList.remove('maximized');
                    Object.assign(win.style, windowData.savedState);
                } else {
                    windowData.savedState = {
                        top: win.style.top,
                        left: win.style.left,
                        width: win.style.width,
                        height: win.style.height
                    };
                    win.classList.add('maximized');
                }
            }
        }
        
        // --- UI & Interactions ---
        function createIconElement(itemData, isInsideFolder = false) {
            const template = document.getElementById('icon-template');
            const clone = template.content.cloneNode(true);
            const iconDiv = clone.querySelector('.desktop-icon');
            const iconImg = iconDiv.querySelector('img');
            iconDiv.dataset.id = itemData.id;

            if (itemData.type === 'folder') {
                iconImg.src = 'https://img.icons8.com/fluency/96/folder-invoices.png';
                iconDiv.classList.add('folder');
                iconDiv.addEventListener('dragover', (e) => { e.preventDefault(); iconDiv.classList.add('drag-over'); });
                iconDiv.addEventListener('dragleave', () => iconDiv.classList.remove('drag-over'));
                iconDiv.addEventListener('drop', (e) => handleDropOnFolder(e, itemData.id));
            } else {
                iconImg.src = itemData.icon || getFaviconUrl(itemData.url);
                iconImg.onerror = function() { this.src = 'https://img.icons8.com/color/96/000000/file.png'; };
            }

            iconDiv.querySelector('.icon-label').textContent = itemData.name;
            iconDiv.addEventListener('click', (e) => launchApp(itemData));

            if (itemData.type !== 'builtin' || itemData.id === 'app-settings') {
                iconDiv.addEventListener('contextmenu', (e) => showContextMenu(e, { ...itemData, isInsideFolder }));
            }

            if (!isInsideFolder && itemData.id !== 'app-settings') {
                iconDiv.addEventListener('dragstart', (e) => handleIconDragStart(e, itemData.id));
            } else {
                iconDiv.draggable = false;
            }
            
            return iconDiv;
        }

            if (left + menuWidth > viewportWidth) left = viewportWidth - menuWidth - 10;

        function hideContextMenu() {
             contextMenu.style.display = 'none';
             contextTarget = null;
        }
        
        function setupWindowInteractions(id, win) {
            const titleBar = win.querySelector('.title-bar');
            const resizer = win.querySelector('.resizer');
            
            win.addEventListener('mousedown', () => focusWindow(id), true);
            
            win.querySelector('.close').addEventListener('click', () => closeWindow(id));
            win.querySelector('.minimize').addEventListener('click', () => minimizeWindow(id));
            win.querySelector('.maximize').addEventListener('click', () => toggleMaximizeWindow(id));
            win.querySelector('.refresh').addEventListener('click', () => {
                const iframe = win.querySelector('iframe');
                if (iframe) {
                    iframe.contentWindow.location.reload(true);
                }
            });
            titleBar.addEventListener('dblclick', () => toggleMaximizeWindow(id));
            
            const startAction = (e, type) => {
                if ((type === 'drag' && e.target.tagName === 'BUTTON') || win.classList.contains('maximized')) return;
                e.preventDefault();
                focusWindow(id);
                
                actionState.active = true;
                actionState.type = type;
                actionState.target = win;
                actionState.startX = e.clientX;
                actionState.startY = e.clientY;

                const style = window.getComputedStyle(win);
                if (type === 'drag') {
                    actionState.initialLeft = parseInt(style.left, 10) || 0;
                    actionState.initialTop = parseInt(style.top, 10) || 0;
                } else {
                    actionState.initialWidth = parseInt(style.width, 10);
                    actionState.initialHeight = parseInt(style.height, 10);
                }
                
                const overlay = document.createElement('div');
                overlay.id = 'global-action-overlay';
                overlay.style.cssText = `position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10000; cursor: ${type === 'drag' ? 'move' : 'nwse-resize'};`;
                document.body.appendChild(overlay);
            };
            
            titleBar.addEventListener('mousedown', (e) => startAction(e, 'drag'));
            resizer.addEventListener('mousedown', (e) => startAction(e, 'resize'));
        }

        function addToTaskbar(id, title) {
            const item = document.createElement('div');
            item.className = 'taskbar-item';
            item.id = `taskbar-${id}`;
            item.textContent = title.substring(0, 15) + (title.length > 15 ? '…' : '');
            item.title = title;
            item.addEventListener('click', () => focusWindow(id));
            taskbarItems.appendChild(item);
        }
        
        function applyLayout(layoutType) {
            const windowsToTile = Array.from(openWindows.values()).filter(w => !w.minimized && !w.element.classList.contains('maximized')).map(w => w.element);
            if (windowsToTile.length === 0) return;

            const taskbarHeight = 40;
            const w = window.innerWidth;
            const h = window.innerHeight - taskbarHeight;
            const p = 5; // padding

            windowsToTile.forEach(win => {
                win.style.transition = 'all 0.3s ease-in-out';
                setTimeout(() => win.style.transition = 'none', 300);
            });

            if (layoutType === 'focus' && windowsToTile.length >= 1) {
                const win = windowsToTile[0];
                win.style.top = `${p}px`;
                win.style.left = `${p}px`;
                win.style.width = `${w - 2 * p}px`;
                win.style.height = `${h - 2 * p}px`;
            } else if (layoutType === 'vertical-split' && windowsToTile.length >= 2) {
                const win1 = windowsToTile[0], win2 = windowsToTile[1];
                win1.style.top = `${p}px`; win1.style.left = `${p}px`; win1.style.width = `${w - 2 * p}px`; win1.style.height = `${h / 2 - 1.5 * p}px`;
                win2.style.top = `${h / 2 + p / 2}px`; win2.style.left = `${p}px`; win2.style.width = `${w - 2 * p}px`; win2.style.height = `${h / 2 - 1.5 * p}px`;
            } else if (layoutType === 'horizontal-split' && windowsToTile.length >= 2) {
                const win1 = windowsToTile[0], win2 = windowsToTile[1];
                win1.style.top = `${p}px`; win1.style.left = `${p}px`; win1.style.width = `${w / 2 - 1.5 * p}px`; win1.style.height = `${h - 2 * p}px`;
                win2.style.top = `${p}px`; win2.style.left = `${w / 2 + p / 2}px`; win2.style.width = `${w / 2 - 1.5 * p}px`; win2.style.height = `${h - 2 * p}px`;
            } else if (layoutType === 'three-panel' && windowsToTile.length >= 3) {
                 const [win1, win2, win3] = windowsToTile;
                 win1.style.top = `${p}px`; win1.style.left = `${p}px`; win1.style.width = `${w/2 - 1.5*p}px`; win1.style.height = `${h/2 - 1.5*p}px`;
                 win2.style.top = `${p}px`; win2.style.left = `${w/2 + p/2}px`; win2.style.width = `${w/2 - 1.5*p}px`; win2.style.height = `${h/2 - 1.5*p}px`;
                 win3.style.top = `${h/2 + p/2}px`; win3.style.left = `${p}px`; win3.style.width = `${w - 2*p}px`; win3.style.height = `${h/2 - 1.5*p}px`;
            } else if (layoutType === 'quadrant' && windowsToTile.length >= 4) {
                const [win1, win2, win3, win4] = windowsToTile;
                win1.style.top = `${p}px`; win1.style.left = `${p}px`; win1.style.width = `${w/2 - 1.5*p}px`; win1.style.height = `${h/2 - 1.5*p}px`;
                win2.style.top = `${p}px`; win2.style.left = `${w/2 + p/2}px`; win2.style.width = `${w/2 - 1.5*p}px`; win2.style.height = `${h/2 - 1.5*p}px`;
                win3.style.top = `${h/2 + p/2}px`; win3.style.left = `${p}px`; win3.style.width = `${w/2 - 1.5*p}px`; win3.style.height = `${h/2 - 1.5*p}px`;
                win4.style.top = `${h/2 + p/2}px`; win4.style.left = `${w/2 + p/2}px`; win4.style.width = `${w/2 - 1.5*p}px`; win4.style.height = `${h/2 - 1.5*p}px`;
            }
        }

        // --- Folder Logic ---
        function handleIconDragStart(e, itemId) {
            actionState.draggedItemId = itemId;
            e.dataTransfer.setData('text/plain', itemId);
            e.dataTransfer.effectAllowed = 'move';
        }
        
        function handleDropOnFolder(e, folderId) {
            e.preventDefault();
            const itemId = actionState.draggedItemId || e.dataTransfer.getData('text/plain');
            e.currentTarget.classList.remove('drag-over');

            if (!itemId || itemId === folderId) {
                actionState.draggedItemId = null;
                return;
            }

            const draggedItem = allDesktopItems.find(item => item.id === itemId);
            if (!draggedItem) {
                actionState.draggedItemId = null;
                return;
            }

            if (draggedItem.type === 'builtin') {
                showToast("Built-in apps cannot be moved into folders.");
                actionState.draggedItemId = null;
                return;
            }
            if (draggedItem.type === 'folder') {
                showToast("Nesting folders is not supported.");
                actionState.draggedItemId = null;
                return;
            }
            
            const itemRef = db.ref(`desktop_links/${itemId}`);
            itemRef.update({ folderId: folderId })
                .then(() => showToast(`Moved '${draggedItem.name}' into folder.`))
                .catch(err => {
                    console.error(err);
                    showToast('Error moving item.');
                });

            actionState.draggedItemId = null;
        }
        
        function createNewFolder() {
            const folderName = prompt("Enter folder name:", "New Folder");
            if (folderName) {
                const newFolderRef = db.ref('desktop_folders').push();
                const newFolder = {
                    id: newFolderRef.key,
                    name: folderName,
                    type: 'folder'
                };
                newFolderRef.set(newFolder);
            }
        }

            const closeModal = () => modal.remove();
            modal.querySelector('.close').addEventListener('click', closeModal);
            modal.querySelectorAll('.folder-select-item').forEach(button => {
                button.addEventListener('click', () => {
                    moveItemToFolder(itemToMove.id, button.dataset.folderid);
                    closeModal();
                });
            });
        }
        
        function rerenderFolderWindow(folderId, winInstance = null) {
            const windowData = winInstance ? { element: winInstance } : openWindows.get(folderId);
            if (!windowData) return;

            const windowBody = windowData.element.querySelector('.window-body.folder-body');
            if (!windowBody) return;

            windowBody.innerHTML = ''; // Clear content
            const itemsInFolder = allDesktopItems.filter(item => item.folderId === folderId);
            itemsInFolder.forEach(itemData => {
                const iconEl = createIconElement(itemData, true);
                windowBody.appendChild(iconEl);
            });
        }
        
        function initializeDesktop() {
             // Detach old listeners to prevent duplicates
            if (dbListeners.links) dbListeners.links.ref.off('value', dbListeners.links.callback);
            if (dbListeners.folders) dbListeners.folders.ref.off('value', dbListeners.folders.callback);

            const linksRef = db.ref('desktop_links');
            const foldersRef = db.ref('desktop_folders');

            const loadAllItems = () => {
                Promise.all([linksRef.once('value'), foldersRef.once('value')]).then(([linksSnap, foldersSnap]) => {
                    const links = linksSnap.val() || {};
                    const folders = foldersSnap.val() || {};
                    
                    const linkItems = Object.values(links).map(link => ({ ...link, type: 'link' }));
                    const folderItems = Object.values(folders).map(folder => ({ ...folder, type: 'folder' }));
                    
                    allDesktopItems = [settingsApp, ...builtInApps, ...linkItems, ...folderItems];
                    renderAllIcons();
                    updateStartMenuResults();

                    openWindows.forEach((winData, winId) => {
                        const itemData = allDesktopItems.find(item => item.id === winId);
                        if (itemData && itemData.type === 'folder') {
                            rerenderFolderWindow(winId, winData.element);
                        }
                    });
                });
            };
            
            // Store listener references before attaching
            dbListeners.links = { ref: linksRef, callback: loadAllItems };
            dbListeners.folders = { ref: foldersRef, callback: loadAllItems };

            linksRef.on('value', dbListeners.links.callback);
            foldersRef.on('value', dbListeners.folders.callback);

            loadAllItems(); // Initial load
        }
        
        function cleanupDesktop() {
            openWindows.forEach((_, id) => closeWindow(id));
            openWindows.clear();
            desktop.innerHTML = '';
            taskbarItems.innerHTML = '';
            zIndexCounter = 10;
            activeWindowId = null;
            allDesktopItems = [];

            // Detach DB listeners
            if (dbListeners.links) dbListeners.links.ref.off('value', dbListeners.links.callback);
            if (dbListeners.folders) dbListeners.folders.ref.off('value', dbListeners.folders.callback);
            dbListeners = {};
        }

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            try {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                auth = firebase.auth();
                
                auth.onAuthStateChanged(user => {
                    if (user) {
                        loginView.style.display = 'none';
                        mainContent.style.display = 'block';
                        initializeDesktop();
                    } else {
                        loginView.style.display = 'flex';
                        mainContent.style.display = 'none';
                        cleanupDesktop();
                    }
                });
                
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;
                    auth.signInWithEmailAndPassword(email, password)
                        .catch(error => alert("Login failed: " + error.message));
                });

            } catch(e) { 
                console.error(e);
                alert("Firebase connection failed."); 
            }
            
            // Global event listeners that don't depend on auth state
            window.addEventListener('mousemove', handleActionMove);
            window.addEventListener('mouseup', handleActionEnd);
            window.addEventListener('mouseleave', handleActionEnd); 

            document.addEventListener('click', (e) => {
                if (!contextMenu.contains(e.target)) hideContextMenu();
                if (!startMenu.contains(e.target) && e.target.closest('#start-menu-button') === null) {
                    startMenu.classList.add('hidden');
                }
            });

            mainContent.addEventListener('contextmenu', e => {
                 if(e.target === desktop) {
                    showContextMenu(e, null);
                }
            });

            contextMenu.addEventListener('click', (e) => {
                const button = e.target.closest('button');
                if (button && !button.disabled) {
                    const action = button.dataset.action;
                    if (action === 'logout') {
                        auth.signOut();
                    } else if (action === 'newFolder') {
                        createNewFolder();
                    } else if (action === 'moveToFolder') {
                        showMoveToFolderModal(contextTarget);
                    } else if (action === 'moveToDesktop') {
                        moveItemToDesktop(contextTarget.id);
                    } else if (action === 'deleteLink') {
                        deleteLink(contextTarget.id);
                    } else {
                        launchApp(contextTarget, action);
                    }
                }
                hideContextMenu();
            });

            document.getElementById('start-menu-button').addEventListener('click', (e) => {
                e.stopPropagation();
                startMenu.classList.toggle('hidden');
                if (!startMenu.classList.contains('hidden')) startMenuSearch.focus();
            });

            startMenuSearch.addEventListener('input', () => updateStartMenuResults(startMenuSearch.value));
            startMenuResults.addEventListener('click', (e) => {
                const li = e.target.closest('li');
                if (li) {
                    const itemData = allDesktopItems.find(app => app.id === li.dataset.appid);
                    if (itemData) launchApp(itemData);
                }
            });
            
            document.getElementById('tile-focus').addEventListener('click', () => applyLayout('focus'));
            document.getElementById('tile-vertical').addEventListener('click', () => applyLayout('vertical-split'));
            document.getElementById('tile-horizontal').addEventListener('click', () => applyLayout('horizontal-split'));
            document.getElementById('tile-three-panel').addEventListener('click', () => applyLayout('three-panel'));
            document.getElementById('tile-quadrant').addEventListener('click', () => applyLayout('quadrant'));
        });
    </script>
