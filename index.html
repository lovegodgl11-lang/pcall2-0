        let openWindows = new Map();
        let zIndexCounter = 10;
        let activeWindowId = null;
        let contextTarget = null; // Can be an app, a folder, or the desktop itself
        let allDesktopItems = []; // Combined apps and folders
        const builtInApps = [
            { id: 'app-music', name: 'Music Player', type: 'builtin', icon: 'https://img.icons8.com/fluency/96/music.png' },
            { id: 'app-video', name: 'Video Player', type: 'builtin', icon: 'https://img.icons8.com/fluency/96/play-button-circled.png' }
        ];

        // --- Centralized Drag & Resize State ---
        let actionState = {
            active: false,
            type: null, // 'drag', 'resize', 'icon-drag'
            target: null,
            startX: 0,
            startY: 0,
            initialLeft: 0,
            initialTop: 0,
            initialWidth: 0,
            initialHeight: 0,
            draggedItemId: null
        };

        // --- Reusable Utility Functions ---
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
        }
        
        function showToast(message) {
            const existingToast = document.querySelector('.toast-notification');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.className = 'toast-notification fixed bottom-12 right-5 bg-gray-900 text-white py-2 px-4 rounded-lg shadow-lg z-50';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // --- Global Event Handlers for Drag/Resize ---
        function handleActionMove(e) {
            if (!actionState.active) return;
            e.preventDefault();

            if (actionState.type === 'drag') {
                const dx = e.clientX - actionState.startX;
                const dy = e.clientY - actionState.startY;
                actionState.target.style.left = `${actionState.initialLeft + dx}px`;
                actionState.target.style.top = `${actionState.initialTop + dy}px`;
            } else if (actionState.type === 'resize') {
                const dw = e.clientX - actionState.startX;
                const dh = e.clientY - actionState.startY;
                const newWidth = actionState.initialWidth + dw;
                const newHeight = actionState.initialHeight + dh;
                const minWidth = parseInt(getComputedStyle(actionState.target).minWidth, 10);
                const minHeight = parseInt(getComputedStyle(actionState.target).minHeight, 10);
                
                if (newWidth >= minWidth) actionState.target.style.width = `${newWidth}px`;
                if (newHeight >= minHeight) actionState.target.style.height = `${newHeight}px`;
            }
        }

        function handleActionEnd(e) {
            if (!actionState.active) return;
            const overlay = document.getElementById('global-action-overlay');
            if (overlay) {
                overlay.remove();
            }
            actionState.active = false;
            actionState.target = null;
        }

        window.addEventListener('mousemove', handleActionMove);
        window.addEventListener('mouseup', handleActionEnd);
        window.addEventListener('mouseleave', handleActionEnd); 

        // --- App & Window Management ---
        function getFaviconUrl(url) {
            try {
                const domain = new URL(url).hostname;
                return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
            } catch (e) {
                return 'https://img.icons8.com/color/96/000000/file.png'; // Default icon
            }
        }
        
        function launchApp(appData, action = 'popup') {
            if (!appData) return;
            if (appData.type === 'folder') {
                createWindow(appData);
                return;
            }
            if (appData.type === 'builtin' && action !== 'popup') {
                alert("Built-in apps can only be opened as popups.");
                return;
            }
            switch (action) {
                case 'popup':
                    createWindow(appData);
                    break;
                case 'newWindow':
                    window.open(appData.url, '_blank');
                    break;
                case 'sameWindow':
                    window.location.href = appData.url;
                    break;
            }
            hideContextMenu();
            startMenu.classList.add('hidden');
        }

        function createWindow(appData) {
            if (openWindows.has(appData.id)) {
                focusWindow(appData.id);
                return;
            }

            const template = document.getElementById('window-template');
            const clone = template.content.cloneNode(true);
            const win = clone.querySelector('.window');
            win.id = `window-${appData.id}`;
            win.querySelector('.title').textContent = appData.name;
            const windowBody = win.querySelector('.window-body');

            // Handle content type
            if (appData.type === 'builtin') {
                if (appData.id === 'app-music') {
                    windowBody.innerHTML = createMusicPlayerContent();
                    setupMusicPlayer(win);
                } else if (appData.id === 'app-video') {
                    windowBody.innerHTML = createVideoPlayerContent();
                    setupVideoPlayer(win);
                }
            } else if (appData.type === 'folder') {
                windowBody.classList.add('folder-body');
                rerenderFolderWindow(appData.id, win);
            } else { // It's a link
                const iframe = document.createElement('iframe');
                iframe.src = appData.url;
                iframe.frameborder = "0";
                windowBody.appendChild(iframe);
            }

            const initialWidth = 800;
            const initialHeight = 600;
            win.style.width = `${initialWidth}px`;
            win.style.height = `${initialHeight}px`;

            const viewportHeight = window.innerHeight - 40;
            const viewportWidth = window.innerWidth;
            const top = 50 + (openWindows.size * 25) % Math.max(1, viewportHeight - initialHeight);
            const left = 100 + (openWindows.size * 25) % Math.max(1, viewportWidth - initialWidth);
            win.style.top = `${top}px`;
            win.style.left = `${left}px`;
            
            document.body.appendChild(win);
            
            const windowData = { element: win, minimized: false, savedState: {} };
            openWindows.set(appData.id, windowData);
            
            setupWindowInteractions(appData.id, win);
            addToTaskbar(appData.id, appData.name);
            focusWindow(appData.id);
        }

        function focusWindow(id) {
            if (activeWindowId && activeWindowId !== id) {
                const oldActive = openWindows.get(activeWindowId);
                if(oldActive) {
                    oldActive.element.style.zIndex = zIndexCounter - 1;
                    document.getElementById(`taskbar-${activeWindowId}`)?.classList.remove('active');
                }
            }
            const windowData = openWindows.get(id);
            if(windowData) {
                windowData.element.style.zIndex = zIndexCounter++;
                document.getElementById(`taskbar-${id}`)?.classList.add('active');
                activeWindowId = id;

                const wasMinimized = windowData.minimized;
                if(wasMinimized) {
                    windowData.element.style.display = 'flex';
                    windowData.minimized = false;
                }
            }
        }

        function closeWindow(id) {
            const windowData = openWindows.get(id);
            if (windowData) {
                windowData.element.remove();
                openWindows.delete(id);
                document.getElementById(`taskbar-${id}`).remove();
            }
        }
        
        function minimizeWindow(id) {
            const windowData = openWindows.get(id);
            if(windowData) {
                windowData.element.style.display = 'none';
                windowData.minimized = true;
                document.getElementById(`taskbar-${id}`)?.classList.remove('active');
                if (activeWindowId === id) {
                    activeWindowId = null;
                }
            }
        }
        
        function toggleMaximizeWindow(id) {
            const windowData = openWindows.get(id);
            if(windowData) {
                const win = windowData.element;
                if(win.classList.contains('maximized')) {
                    win.classList.remove('maximized');
                    Object.assign(win.style, windowData.savedState);
                } else {
                    windowData.savedState = {
                        top: win.style.top,
                        left: win.style.left,
                        width: win.style.width,
                        height: win.style.height
                    };
                    win.classList.add('maximized');
                }
            }
        }
        
        // --- UI & Interactions ---
        function createIconElement(itemData, isInsideFolder = false) {
            const template = document.getElementById('icon-template');
            const clone = template.content.cloneNode(true);
            const iconDiv = clone.querySelector('.desktop-icon');
            const iconImg = iconDiv.querySelector('img');
            iconDiv.dataset.id = itemData.id;

                iconImg.src = 'https://img.icons8.com/fluency/96/folder-invoices.png';

                iconDiv.addEventListener('dragover', (e) => { e.preventDefault(); iconDiv.classList.add('drag-over'); });
                iconDiv.addEventListener('dragleave', () => iconDiv.classList.remove('drag-over'));
                iconDiv.addEventListener('drop', (e) => handleDropOnFolder(e, itemData.id));
            } else {
                iconImg.src = itemData.type === 'builtin' ? itemData.icon : getFaviconUrl(itemData.url);
                iconImg.onerror = function() { this.src = 'https://img.icons8.com/color/96/000000/file.png'; };
            }

            iconDiv.querySelector('.icon-label').textContent = itemData.name;
            iconDiv.addEventListener('click', (e) => launchApp(itemData));

            // Add context menu for links and folders, and pass whether it's inside a folder
            if (itemData.type === 'link' || itemData.type === 'folder') {
                iconDiv.addEventListener('contextmenu', (e) => showContextMenu(e, { ...itemData, isInsideFolder }));
            }

            // Draggable only if on desktop
            if (!isInsideFolder) {
                iconDiv.addEventListener('dragstart', (e) => handleIconDragStart(e, itemData.id));
            }
            
            return iconDiv;
        }

        function setupWindowInteractions(id, win) {
            const titleBar = win.querySelector('.title-bar');
            const resizer = win.querySelector('.resizer');
            
            win.addEventListener('mousedown', () => focusWindow(id), true);
            
            win.querySelector('.close').addEventListener('click', () => closeWindow(id));
            win.querySelector('.minimize').addEventListener('click', () => minimizeWindow(id));
            win.querySelector('.maximize').addEventListener('click', () => toggleMaximizeWindow(id));
            win.querySelector('.refresh').addEventListener('click', () => {
                const iframe = win.querySelector('iframe');
                if (iframe) {
                    iframe.contentWindow.location.reload(true);
                }
            });
            titleBar.addEventListener('dblclick', () => toggleMaximizeWindow(id));
            
            const startAction = (e, type) => {
                if ((type === 'drag' && e.target.tagName === 'BUTTON') || win.classList.contains('maximized')) return;
                e.preventDefault();
                focusWindow(id);
                
                actionState.active = true;
                actionState.type = type;
                actionState.target = win;
                actionState.startX = e.clientX;
                actionState.startY = e.clientY;

                const style = window.getComputedStyle(win);
                if (type === 'drag') {
                    actionState.initialLeft = parseInt(style.left, 10) || 0;
                    actionState.initialTop = parseInt(style.top, 10) || 0;
                } else {
                    actionState.initialWidth = parseInt(style.width, 10);
                    actionState.initialHeight = parseInt(style.height, 10);
                }
                
                const overlay = document.createElement('div');
                overlay.id = 'global-action-overlay';
                overlay.style.cssText = `position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10000; cursor: ${type === 'drag' ? 'move' : 'nwse-resize'};`;
                document.body.appendChild(overlay);
            };
            
            titleBar.addEventListener('mousedown', (e) => startAction(e, 'drag'));
            resizer.addEventListener('mousedown', (e) => startAction(e, 'resize'));
        }

        function addToTaskbar(id, title) {
            const item = document.createElement('div');
            item.className = 'taskbar-item';
            item.id = `taskbar-${id}`;
            item.textContent = title.substring(0, 15) + (title.length > 15 ? '…' : '');
            item.title = title;
            item.addEventListener('click', () => focusWindow(id));
            taskbarItems.appendChild(item);
        }
        
        function applyLayout(layoutType) {
            const windowsToTile = Array.from(openWindows.values()).filter(w => !w.minimized && !w.element.classList.contains('maximized')).map(w => w.element);
            if (windowsToTile.length === 0) return;

            const taskbarHeight = 40;
            const w = window.innerWidth;
            const h = window.innerHeight - taskbarHeight;
            const p = 5; // padding

            windowsToTile.forEach(win => {
                win.style.transition = 'all 0.3s ease-in-out';
                setTimeout(() => win.style.transition = 'none', 300);
            });

            if (layoutType === 'focus' && windowsToTile.length >= 1) {
                const win = windowsToTile[0];
                win.style.top = `${p}px`;
                win.style.left = `${p}px`;
                win.style.width = `${w - 2 * p}px`;
                win.style.height = `${h - 2 * p}px`;
            } else if (layoutType === 'vertical-split' && windowsToTile.length >= 2) {
                const win1 = windowsToTile[0], win2 = windowsToTile[1];
                win1.style.top = `${p}px`; win1.style.left = `${p}px`; win1.style.width = `${w - 2 * p}px`; win1.style.height = `${h / 2 - 1.5 * p}px`;
                win2.style.top = `${h / 2 + p / 2}px`; win2.style.left = `${p}px`; win2.style.width = `${w - 2 * p}px`; win2.style.height = `${h / 2 - 1.5 * p}px`;
            } else if (layoutType === 'horizontal-split' && windowsToTile.length >= 2) {
                const win1 = windowsToTile[0], win2 = windowsToTile[1];
                win1.style.top = `${p}px`; win1.style.left = `${p}px`; win1.style.width = `${w / 2 - 1.5 * p}px`; win1.style.height = `${h - 2 * p}px`;
                win2.style.top = `${p}px`; win2.style.left = `${w / 2 + p / 2}px`; win2.style.width = `${w / 2 - 1.5 * p}px`; win2.style.height = `${h - 2 * p}px`;
            } else if (layoutType === 'three-panel' && windowsToTile.length >= 3) {
                 const [win1, win2, win3] = windowsToTile;
                 win1.style.top = `${p}px`; win1.style.left = `${p}px`; win1.style.width = `${w/2 - 1.5*p}px`; win1.style.height = `${h/2 - 1.5*p}px`;
                 win2.style.top = `${p}px`; win2.style.left = `${w/2 + p/2}px`; win2.style.width = `${w/2 - 1.5*p}px`; win2.style.height = `${h/2 - 1.5*p}px`;
                 win3.style.top = `${h/2 + p/2}px`; win3.style.left = `${p}px`; win3.style.width = `${w - 2*p}px`; win3.style.height = `${h/2 - 1.5*p}px`;
            } else if (layoutType === 'quadrant' && windowsToTile.length >= 4) {
                const [win1, win2, win3, win4] = windowsToTile;
                win1.style.top = `${p}px`; win1.style.left = `${p}px`; win1.style.width = `${w/2 - 1.5*p}px`; win1.style.height = `${h/2 - 1.5*p}px`;
                win2.style.top = `${p}px`; win2.style.left = `${w/2 + p/2}px`; win2.style.width = `${w/2 - 1.5*p}px`; win2.style.height = `${h/2 - 1.5*p}px`;
                win3.style.top = `${h/2 + p/2}px`; win3.style.left = `${p}px`; win3.style.width = `${w/2 - 1.5*p}px`; win3.style.height = `${h/2 - 1.5*p}px`;
                win4.style.top = `${h/2 + p/2}px`; win4.style.left = `${w/2 + p/2}px`; win4.style.width = `${w/2 - 1.5*p}px`; win4.style.height = `${h/2 - 1.5*p}px`;
            }
        }

        function setupMusicPlayer(win) {
            let playlist = [], originalPlaylist = [];
            let currentTrackIndex = 0;
            let repeatMode = 'none'; // 'none', 'one', 'all'
            let isShuffled = false;
            
            const audio = win.querySelector('#audio-player');
            const playPauseBtn = win.querySelector('#play-pause-btn');
            const playIcon = win.querySelector('#play-icon');
            const pauseIcon = win.querySelector('#pause-icon');
            const prevBtn = win.querySelector('#prev-btn');
            const nextBtn = win.querySelector('#next-btn');
            const repeatBtn = win.querySelector('#repeat-btn');
            const shuffleBtn = win.querySelector('#shuffle-btn');
            const titleEl = win.querySelector('.track-title');
            const artistEl = win.querySelector('.track-artist');
            const playlistEl = win.querySelector('.playlist');
            const addMusicBtn = win.querySelector('.add-music-btn');
            const musicFileInput = win.querySelector('#music-file-input');
            const progressBar = win.querySelector('.progress-bar');
            const currentTimeEl = win.querySelector('.current-time');
            const totalTimeEl = win.querySelector('.total-time');

            addMusicBtn.addEventListener('click', () => musicFileInput.click());

            musicFileInput.addEventListener('change', (e) => {
                const files = e.target.files;
                if(files.length === 0) return;
                
                const newTracks = Array.from(files).map(file => ({
                    title: file.name.replace(/\.[^/.]+$/, ""), artist: "Local File", src: URL.createObjectURL(file), file: file
                }));
                
                const wasEmpty = originalPlaylist.length === 0;
                originalPlaylist.push(...newTracks);
                
                if (isShuffled) {
                    shufflePlaylist();
                } else {
                    playlist = [...originalPlaylist];
                }
                updatePlaylistUI();
                if (wasEmpty && playlist.length > 0) loadTrack(0);
            });

            function loadTrack(index) {
                if (index < 0 || index >= playlist.length) return;
                currentTrackIndex = index;
                const track = playlist[index];
                audio.src = track.src;
                titleEl.textContent = track.title;
                artistEl.textContent = track.artist;
                audio.load();
                updatePlaylistUI();
            }

            function playTrack() { audio.play(); playIcon.style.display = 'none'; pauseIcon.style.display = 'block'; }
            function pauseTrack() { audio.pause(); playIcon.style.display = 'block'; pauseIcon.style.display = 'none'; }
            function playPause() { if(playlist.length > 0) audio.paused ? playTrack() : pauseTrack(); }
            
            function nextTrack() {
                if (playlist.length === 0) return;
                let newIndex = (currentTrackIndex + 1) % playlist.length;
                if (repeatMode === 'none' && currentTrackIndex === playlist.length - 1) {
                    pauseTrack();
                    loadTrack(0);
                    return;
                }
                loadTrack(newIndex);
                playTrack();
            }
            
            function prevTrack() { if (playlist.length > 0) { loadTrack((currentTrackIndex - 1 + playlist.length) % playlist.length); playTrack(); } }
            
            audio.addEventListener('ended', () => {
                if (repeatMode === 'one') {
                    audio.currentTime = 0;
                    playTrack();
                } else {
                    nextTrack();
                }
            });
            
            function updatePlaylistUI() {
                if(playlist.length === 0) {
                    playlistEl.innerHTML = '<p class="text-center text-gray-400 p-4">Your playlist is empty.</p>';
                    return;
                }
                playlistEl.innerHTML = playlist.map((track, index) =>
                    `<div class="playlist-item ${index === currentTrackIndex ? 'playing' : ''}" data-index="${index}" title="${track.title}">${track.title}</div>`
                ).join('');
                playlistEl.querySelectorAll('.playlist-item').forEach(item => {
                    item.addEventListener('click', () => { loadTrack(parseInt(item.dataset.index)); playTrack(); });
                });
            }

            repeatBtn.addEventListener('click', () => {
                if (repeatMode === 'none') {
                    repeatMode = 'all';
                    repeatBtn.classList.add('active');
                    repeatBtn.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"></path></svg>`;
                } else if (repeatMode === 'all') {
                    repeatMode = 'one';
                    repeatBtn.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v2.5H13z"></path></svg>`;
                } else {
                    repeatMode = 'none';
                    repeatBtn.classList.remove('active');
                    repeatBtn.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"></path></svg>`;
                }
            });
            
            shuffleBtn.addEventListener('click', () => {
                isShuffled = !isShuffled;
                shuffleBtn.classList.toggle('active', isShuffled);
                if (isShuffled) {
                    shufflePlaylist();
                } else {
                    playlist = [...originalPlaylist];
                    const currentSongSrc = audio.src;
                    currentTrackIndex = playlist.findIndex(t => t.src === currentSongSrc);
                }
                updatePlaylistUI();
            });
            
            function shufflePlaylist() {
                let currentIndex = originalPlaylist.length, randomIndex;
                const shuffled = [...originalPlaylist];
                while (currentIndex != 0) {
                    randomIndex = Math.floor(Math.random() * currentIndex);
                    currentIndex--;
                    [shuffled[currentIndex], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[currentIndex]];
                }
                playlist = shuffled;
                if(audio.src) {
                    currentTrackIndex = playlist.findIndex(t => t.src === audio.src);
                }
            }
            
            audio.addEventListener('timeupdate', () => {
                if (audio.duration) {
                    const progressPercent = (audio.currentTime / audio.duration) * 100;
                    progressBar.value = progressPercent;
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                }
            });
            audio.addEventListener('loadedmetadata', () => {
                totalTimeEl.textContent = formatTime(audio.duration);
            });
            progressBar.addEventListener('input', () => {
                if (audio.duration) {
                    const seekTime = (progressBar.value / 100) * audio.duration;
                    audio.currentTime = seekTime;
                }
            });

            playPauseBtn.addEventListener('click', playPause);
            nextBtn.addEventListener('click', nextTrack);
            prevBtn.addEventListener('click', prevTrack);
            updatePlaylistUI();
        }
        
        function createVideoPlayerContent() {
            return `
                <div class="video-player-container">
                    <div class="video-player">
                        <div class="prompt">
                            <h2>No Video Loaded</h2>
                            <button class="open-video-btn">Open Video File(s)</button>
                            <input type="file" id="video-file-input" accept="video/*" multiple style="display:none;">
                        </div>
                        <video style="display:none;"></video>
                        <div class="custom-video-controls" style="display:none;">
                            <input type="range" class="video-progress-bar" value="0" step="0.1" max="100">
                            <div class="control-buttons">
                                <button class="video-prev-btn" title="Previous"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5-6V18z"></path></svg></button>
                                <button class="video-play-pause-btn" title="Play/Pause">
                                    <svg class="play-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
                                    <svg class="pause-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
                                </button>
                                <button class="video-next-btn" title="Next"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M16 18h2V6h-2zM6 18l8.5-6L6 6z"></path></svg></button>
                                <span class="video-time">0:00 / 0:00</span>
                            </div>
                        </div>
                    </div>
                    <div class="video-playlist-sidebar">
                        <div class="sidebar-header">
                            <h3>Playlist</h3>
                            <button class="toggle-playlist-btn">Hide</button>
                        </div>
                        <div class="video-playlist-items"></div>
                    </div>
                </div>
            `;
        }

        function setupVideoPlayer(win) {
            let playlist = [];
            let currentVideoIndex = -1;

            const videoEl = win.querySelector('video');
            const promptEl = win.querySelector('.prompt');
            const openBtn = win.querySelector('.open-video-btn');
            const fileInput = win.querySelector('#video-file-input');
            const playlistItemsEl = win.querySelector('.video-playlist-items');
            
            const sidebar = win.querySelector('.video-playlist-sidebar');
            const togglePlaylistBtn = win.querySelector('.toggle-playlist-btn');
            const customControls = win.querySelector('.custom-video-controls');
            const playPauseBtn = win.querySelector('.video-play-pause-btn');
            const playIcon = playPauseBtn.querySelector('.play-icon');
            const pauseIcon = playPauseBtn.querySelector('.pause-icon');
            const nextBtn = win.querySelector('.video-next-btn');
            const prevBtn = win.querySelector('.video-prev-btn');
            const progressBar = win.querySelector('.video-progress-bar');
            const timeDisplay = win.querySelector('.video-time');

            openBtn.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', (e) => {
                const files = e.target.files;
                if(files.length > 0) {
                    const newVideos = Array.from(files).map(file => ({
                        name: file.name,
                        src: URL.createObjectURL(file)
                    }));
                    const wasEmpty = playlist.length === 0;
                    playlist.push(...newVideos);
                    renderVideoPlaylist();
                    if (wasEmpty) {
                        loadAndPlayVideo(0);
                    }
                }
            });

            function renderVideoPlaylist() {
                playlistItemsEl.innerHTML = playlist.map((video, index) =>
                    `<div class="playlist-item ${index === currentVideoIndex ? 'playing' : ''}" data-index="${index}" title="${video.name}">${video.name}</div>`
                ).join('');
                
                playlistItemsEl.querySelectorAll('.playlist-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const index = parseInt(item.dataset.index, 10);
                        loadAndPlayVideo(index);
                    });
                });
            }

            function loadAndPlayVideo(index) {
                if (index < 0 || index >= playlist.length) return;
                currentVideoIndex = index;
                videoEl.src = playlist[index].src;
                videoEl.style.display = 'block';
                promptEl.style.display = 'none';
                customControls.style.display = 'flex';
                videoEl.play();
                renderVideoPlaylist();
            }

            function playVideo() { videoEl.play(); }
            function pauseVideo() { videoEl.pause(); }

            function nextVideo() {
                if(playlist.length === 0) return;
                const nextIndex = (currentVideoIndex + 1) % playlist.length;
                loadAndPlayVideo(nextIndex);
            }
            function prevVideo() {
                if(playlist.length === 0) return;
                const prevIndex = (currentVideoIndex - 1 + playlist.length) % playlist.length;
                loadAndPlayVideo(prevIndex);
            }

            function updateControls() {
                if (videoEl.paused) {
                    playIcon.style.display = 'block';
                    pauseIcon.style.display = 'none';
                } else {
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                }
            }

            function updateProgressBar() {
                if (videoEl.duration) {
                    progressBar.value = (videoEl.currentTime / videoEl.duration) * 100;
                    timeDisplay.textContent = `${formatTime(videoEl.currentTime)} / ${formatTime(videoEl.duration)}`;
                }
            }
            
            // Event listeners
            videoEl.addEventListener('ended', nextVideo);
            videoEl.addEventListener('play', updateControls);
            videoEl.addEventListener('pause', updateControls);
            videoEl.addEventListener('timeupdate', updateProgressBar);
            videoEl.addEventListener('loadedmetadata', updateProgressBar);
            
            playPauseBtn.addEventListener('click', () => videoEl.paused ? playVideo() : pauseVideo());
            nextBtn.addEventListener('click', nextVideo);
            prevBtn.addEventListener('click', prevVideo);

            progressBar.addEventListener('input', () => {
                if (videoEl.duration) {
                    videoEl.currentTime = (progressBar.value / 100) * videoEl.duration;
                }
            });

            togglePlaylistBtn.addEventListener('click', () => {
                sidebar.classList.toggle('hidden');
                togglePlaylistBtn.textContent = sidebar.classList.contains('hidden') ? 'Show' : 'Hide';
            });
        }
        
        // --- Start Menu ---
        function updateStartMenuResults(query = "") {
            const filteredApps = allDesktopItems.filter(app => app.name.toLowerCase().includes(query.toLowerCase()));
            startMenuResults.innerHTML = filteredApps.map(app => `
                <li data-appid="${app.id}">
                    <img src="${
                        app.type === 'folder' ? 'https://img.icons8.com/fluency/96/folder-invoices.png' :
                        app.type === 'builtin' ? app.icon : getFaviconUrl(app.url)
                    }" alt="${app.name}">
                    <span>${app.name}</span>
                </li>
            `).join('');
        }

        // --- Folder Logic ---
        function handleIconDragStart(e, itemId) {
            actionState.draggedItemId = itemId;
            e.dataTransfer.setData('text/plain', itemId);
            e.dataTransfer.effectAllowed = 'move';
        }
        
        function handleDropOnFolder(e, folderId) {
            e.preventDefault();
            const itemId = actionState.draggedItemId || e.dataTransfer.getData('text/plain');
            e.currentTarget.classList.remove('drag-over');

            if (!itemId || itemId === folderId) {
                actionState.draggedItemId = null;
                return;
            }

            const draggedItem = allDesktopItems.find(item => item.id === itemId);
            if (!draggedItem) {
                actionState.draggedItemId = null;
                return;
            }

            // Prevent moving unsupported item types
            if (draggedItem.type === 'builtin') {
                showToast("Built-in apps cannot be moved into folders.");
                actionState.draggedItemId = null;
                return;
            }
            if (draggedItem.type === 'folder') {
                showToast("Nesting folders is not supported.");
                actionState.draggedItemId = null;
                return;
            }
            
            // At this point, we know it's a 'link'
            const itemRef = db.ref(`desktop_links/${itemId}`);
            itemRef.update({ folderId: folderId })
                .then(() => showToast(`Moved '${draggedItem.name}' into folder.`))
                .catch(err => {
                    console.error(err);
                    showToast('Error moving item.');
                });

            actionState.draggedItemId = null; // Clear state after drop
        }
        
        function createNewFolder() {
            const folderName = prompt("Enter folder name:", "New Folder");
            if (folderName) {
                const newFolderRef = db.ref('desktop_folders').push();
                const newFolder = {
                    id: newFolderRef.key,
                    name: folderName,
                    type: 'folder'
                };
                newFolderRef.set(newFolder);
            }
        }

        function deleteLink(itemId) {
            if (confirm("Are you sure you want to delete this link? This action is permanent.")) {
                db.ref('desktop_links/' + itemId).remove()
                    .then(() => showToast("Link deleted."))
                    .catch(err => {
                        showToast("Error deleting link.");
                        console.error(err);
                    });
            }
        }

        function moveItemToFolder(itemId, folderId) {
            const item = allDesktopItems.find(i => i.id === itemId);
            if (!item) return;

            db.ref(`desktop_links/${itemId}`).update({ folderId: folderId })
                .then(() => {
                    showToast(`Moved '${item.name}' successfully.`);
                })
                .catch(err => {
                    showToast("Error moving item.");
                    console.error(err);
                });
        }
        
        function moveItemToDesktop(itemId) {
            const item = allDesktopItems.find(i => i.id === itemId);
            if (!item) return;

            db.ref('desktop_links/' + itemId).update({ folderId: null })
                .then(() => {
                    showToast(`Moved '${item.name}' back to the desktop.`);
                })
                .catch(err => {
                    showToast("Error moving item.");
                    console.error(err);
                });
        }

        function showMoveToFolderModal(itemToMove) {
            const existingModal = document.getElementById('move-to-folder-modal');
            if (existingModal) existingModal.remove();

            const folders = allDesktopItems.filter(item => item.type === 'folder');
            
            const modal = document.createElement('div');
            modal.id = 'move-to-folder-modal';
            modal.className = 'window'; 
            modal.style.cssText = `
                width: 350px;
                height: auto;
                min-height: 200px;
                left: calc(50% - 175px);
                top: 150px;
                z-index: ${zIndexCounter + 100};
                max-height: 400px;
            `;

            let folderListHTML = folders.map(folder => `
                <button class="folder-select-item" data-folderid="${folder.id}">
                    <img src="https://img.icons8.com/fluency/96/folder-invoices.png" alt="folder">
                    <span>${folder.name}</span>
                </button>
            `).join('');

            if (folders.length === 0) {
                folderListHTML = `<p class="no-folders-message">No folders available on the desktop.</p>`;
            }
            
            modal.innerHTML = `
                <style>
                    .folder-select-body { padding: 15px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
                    .folder-select-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; border: none; background-color: #f0f0f0; border-radius: 6px; cursor: pointer; text-align: left; transition: background-color 0.2s; }
                    .folder-select-item:hover { background-color: #e0e0e0; }
                    .folder-select-item img { width: 32px; height: 32px; flex-shrink: 0; }
                    .folder-select-item span { font-size: 14px; font-weight: 500; color: #333; }
                    .no-folders-message { text-align: center; color: #666; padding: 20px 0; }
                </style>
                <div class="title-bar">
                    <span class="title">Move "${itemToMove.name}"</span>
                    <div class="window-controls">
                        <button class="close" title="Close">×</button>
                    </div>
                </div>
                <div class="window-body folder-select-body">
                    ${folderListHTML}
                </div>
            `;

            document.body.appendChild(modal);
            
            const closeModal = () => modal.remove();
            
            modal.querySelector('.close').addEventListener('click', closeModal);
            modal.querySelectorAll('.folder-select-item').forEach(button => {
                button.addEventListener('click', () => {
                    const folderId = button.dataset.folderid;
                    moveItemToFolder(itemToMove.id, folderId);
                    closeModal();
                });
            });
        }
        
        function rerenderFolderWindow(folderId, winInstance = null) {
            const windowData = winInstance ? { element: winInstance } : openWindows.get(folderId);
            if (!windowData) return;

            const windowBody = windowData.element.querySelector('.window-body.folder-body');
            if (!windowBody) return;

            windowBody.innerHTML = ''; // Clear content
            const itemsInFolder = allDesktopItems.filter(item => item.folderId === folderId);
            itemsInFolder.forEach(itemData => {
                const iconEl = createIconElement(itemData, true);
                windowBody.appendChild(iconEl);
            });
        }

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            try {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                
                const linksRef = db.ref('desktop_links');
                const foldersRef = db.ref('desktop_folders');

                const loadAllItems = () => {
                    Promise.all([linksRef.once('value'), foldersRef.once('value')]).then(([linksSnap, foldersSnap]) => {
                        const links = linksSnap.val() || {};
                        const folders = foldersSnap.val() || {};
                        
                        const linkItems = Object.values(links).map(link => ({ ...link, type: 'link' }));
                        const folderItems = Object.values(folders).map(folder => ({ ...folder, type: 'folder' }));
                        
                        allDesktopItems = [...builtInApps, ...linkItems, ...folderItems];
                        renderAllIcons();
                        updateStartMenuResults();

                        // Refresh any open folder windows to keep them in sync
                        openWindows.forEach((winData, winId) => {
                            const itemData = allDesktopItems.find(item => item.id === winId);
                            if (itemData && itemData.type === 'folder') {
                                rerenderFolderWindow(winId, winData.element);
                            }
                        });
                    });
                };
                
                loadAllItems();
                linksRef.on('value', loadAllItems);
                foldersRef.on('value', loadAllItems);

            } catch(e) { 
                console.error(e);
                alert("Firebase connection failed."); 
            }
            
            // Event Listeners
            document.addEventListener('click', (e) => {
                if (!contextMenu.contains(e.target)) hideContextMenu();
                if (!startMenu.contains(e.target) && e.target.closest('#start-menu-button') === null) {
                    startMenu.classList.add('hidden');
                }
            });
            desktop.addEventListener('contextmenu', e => {
                 if(e.target === desktop) {
                    showContextMenu(e, null);
                }
            });
            contextMenu.addEventListener('click', (e) => {
                const button = e.target.closest('button');
                if (button && !button.disabled) {
                    const action = button.dataset.action;
                    if (action === 'newFolder') {
                        createNewFolder();
                    } else if (action === 'moveToFolder') {
                        showMoveToFolderModal(contextTarget);
                    } else if (action === 'moveToDesktop') {
                        moveItemToDesktop(contextTarget.id);
                    } else if (action === 'deleteLink') {
                        deleteLink(contextTarget.id);
                    } else {
                        launchApp(contextTarget, action);
                    }
                }
                hideContextMenu();
            });
            document.getElementById('start-menu-button').addEventListener('click', (e) => {
                e.stopPropagation();
                startMenu.classList.toggle('hidden');
                if (!startMenu.classList.contains('hidden')) {
                    startMenuSearch.focus();
                }
            });
            startMenuSearch.addEventListener('input', () => updateStartMenuResults(startMenuSearch.value));
            startMenuResults.addEventListener('click', (e) => {
                const li = e.target.closest('li');
                if (li) {
                    const itemId = li.dataset.appid;
                    const itemData = allDesktopItems.find(app => app.id === itemId);
                    if (itemData) launchApp(itemData);
                }
            });
            
            document.getElementById('tile-focus').addEventListener('click', () => applyLayout('focus'));
            document.getElementById('tile-vertical').addEventListener('click', () => applyLayout('vertical-split'));
            document.getElementById('tile-horizontal').addEventListener('click', () => applyLayout('horizontal-split'));
            document.getElementById('tile-three-panel').addEventListener('click', () => applyLayout('three-panel'));
            document.getElementById('tile-quadrant').addEventListener('click', () => applyLayout('quadrant'));
        });
    </script>
